<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>성막과 성전</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<link rel="stylesheet" href="temples.css">
  <link rel="icon" type="image/png" sizes="48x48" href="favicon-48.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#141210">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="성막과 성전">
  <meta name="mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141210; --bg2:#1c1916; --panel:#231f1b; --panel-2:#2a251f;
  --line:#3a332b; --txt:#EFE9DD; --txt-soft:#A79C8A; --txt-dim:#6f665a;
  --gold:#D9A441; --court:#C68A2E; --holy:#C4453C; --mhk:#8A79B0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);overscroll-behavior-y:contain;
  font-family:'IBM Plex Sans KR',system-ui,sans-serif;line-height:1.7;
  word-break:keep-all;-webkit-font-smoothing:antialiased}
.wrap{max-width:880px;margin:0 auto;padding:0 12px 50px}

header{padding:20px 0 10px;text-align:center}
h1{font-family:'Gowun Batang',serif;font-weight:700;font-size:clamp(24px,6vw,34px);margin:0}
h1 .glow{color:var(--gold)}
.sub{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.2em;
  color:var(--txt-dim);text-transform:uppercase;margin:5px 0 0}

.search{position:relative;margin:12px 0 0}
.search>svg{position:absolute;left:15px;top:21px;transform:translateY(-50%);
  width:17px;height:17px;color:var(--txt-dim);pointer-events:none}
.search input{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:13px;
  padding:11px 42px 11px 44px;color:var(--txt);font-size:14.5px;font-family:inherit;outline:none;transition:.15s}
.search input::placeholder{color:var(--txt-dim)}
.search input:focus{border-color:var(--gold);background:var(--panel-2)}
.search .clr{position:absolute;right:11px;top:21px;transform:translateY(-50%);
  width:24px;height:24px;border:none;background:var(--line);color:var(--txt-soft);border-radius:50%;
  cursor:pointer;display:none;align-items:center;justify-content:center;font-size:14px}
.search .clr.on{display:flex}
.reslist{display:none;flex-direction:column;gap:6px;margin-top:9px}
.reslist.on{display:flex}
.res{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);
  border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;color:var(--txt);
  font-family:inherit;font-size:14px;text-align:left}
.res:hover{background:var(--panel-2);border-color:var(--gold)}
.res span{font-family:'Space Mono',monospace;font-size:10px;color:var(--txt-dim)}
.nores{color:var(--txt-dim);font-size:13px;padding:10px 4px;text-align:center}

/* 제사장 버튼 — 검색창 바로 아래 */
.priestbar{margin:12px 0 0}
.pbtn{width:100%;border:1px solid var(--line);background:linear-gradient(90deg,rgba(217,164,65,.10),var(--panel));
  color:var(--txt);border-radius:13px;padding:12px 16px;font-size:14px;cursor:pointer;font-family:inherit;
  display:flex;align-items:center;gap:10px;transition:.15s}
.pbtn:hover{border-color:var(--gold);background:linear-gradient(90deg,rgba(217,164,65,.18),var(--panel-2))}
.pbtn b{font-weight:600}
.pbtn em{font-style:normal;font-family:'Space Mono',monospace;font-size:10.5px;color:var(--txt-dim);margin-left:auto}
.pbtn .ico{width:26px;height:26px;border-radius:8px;background:var(--gold);color:#1a1712;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:none}

/* 조감도 — 화면 대부분 */
.scenebox{position:relative;margin:12px 0 0;background:radial-gradient(120% 90% at 50% 25%,#1e1a17,#121010);
  border:1px solid var(--line);border-radius:20px;overflow:hidden;touch-action:none;overscroll-behavior:none;-webkit-user-select:none;user-select:none}
svg#scene{width:100%;height:auto;display:block;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;will-change:transform;overscroll-behavior:none;-webkit-touch-callout:none;
  height:min(78vh,700px)}
svg#scene:active{cursor:grabbing}
svg#scene .hot{transition:filter .15s}
svg#scene .hot:hover{filter:brightness(1.4)}
svg#scene .lbl:hover text{fill:var(--gold)}
svg#scene text{font-family:'IBM Plex Sans KR',sans-serif}
.rotbar{position:absolute;right:10px;bottom:10px;display:flex;gap:6px}
.rotbar button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);
  background:rgba(20,18,16,.88);color:var(--txt-soft);cursor:pointer;display:flex;
  align-items:center;justify-content:center;font-size:14px;font-family:'Space Mono',monospace}
.rotbar button:hover{color:var(--gold);border-color:var(--gold)}
.rotbar svg{width:16px;height:16px}
.scenehint{position:absolute;left:12px;bottom:16px;font-family:'Space Mono',monospace;
  font-size:10px;color:var(--txt-dim);letter-spacing:.05em;pointer-events:none;max-width:56%}

/* 구역별 목록 — 정렬된 그리드 */
.glist{margin:14px 0 0;display:flex;flex-direction:column;gap:10px}
.gsec{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:11px 13px}
.ghead{display:flex;align-items:center;gap:8px;font-size:12.5px;font-weight:600;
  color:var(--txt-soft);margin-bottom:9px}
.ghead i{width:9px;height:9px;border-radius:50%;background:var(--gold);flex:none}
.gsec.z-court .ghead i{background:var(--court)}
.gsec.z-holy .ghead i{background:var(--holy)}
.gsec.z-mhk .ghead i{background:var(--mhk)}
.ghead em{font-style:normal;font-family:'Space Mono',monospace;font-size:10px;
  color:var(--txt-dim);margin-left:auto}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:7px}
.gitem{background:var(--bg2);border:1px solid var(--line);border-radius:10px;padding:10px 6px;
  font-size:12.5px;color:var(--txt);cursor:pointer;font-family:inherit;transition:.15s;
  text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gitem:hover{background:var(--panel-2);border-color:var(--gold);color:var(--gold)}

/* 줌 연출 */
.zoomfx{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:0}
.zoomfx.on{animation:suck .34s ease-in forwards}
@keyframes suck{
  0%{opacity:0;transform:scale(1);background:radial-gradient(circle at 50% 45%,rgba(217,164,65,0) 0%,rgba(20,18,16,0) 60%)}
  60%{opacity:1;background:radial-gradient(circle at 50% 45%,rgba(217,164,65,.22) 0%,rgba(20,18,16,.9) 55%)}
  100%{opacity:1;transform:scale(1.9);background:radial-gradient(circle at 50% 45%,rgba(217,164,65,.10) 0%,rgba(20,18,16,1) 45%)}
}
/* 모달 */
.overlay{position:fixed;inset:0;background:rgba(8,7,6,.8);backdrop-filter:blur(3px);display:none;
  align-items:flex-start;justify-content:center;z-index:70;padding:16px 12px;overflow-y:auto}
.overlay.on{display:flex}
.modal{background:var(--panel);border:1px solid var(--line);border-radius:20px;width:100%;
  max-width:560px;margin:auto;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.6);
  animation:zin .28s cubic-bezier(.2,.9,.3,1)}
@keyframes zin{from{transform:scale(.84);opacity:0}to{transform:scale(1);opacity:1}}
.mtop{padding:18px 20px 14px;position:relative}
.mtop:before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--gold)}
.modal.z-court .mtop:before{background:var(--court)}
.modal.z-holy .mtop:before{background:var(--holy)}
.modal.z-mhk .mtop:before{background:var(--mhk)}
.mclose{position:absolute;right:13px;top:13px;width:31px;height:31px;border-radius:50%;
  border:1px solid var(--line);background:var(--bg2);color:var(--txt-soft);cursor:pointer;
  display:flex;align-items:center;justify-content:center;font-size:15px}
.mback{position:absolute;right:52px;top:13px;height:31px;border-radius:16px;padding:0 12px;
  border:1px solid var(--line);background:var(--bg2);color:var(--txt-soft);cursor:pointer;
  font-size:12px;font-family:inherit}
.mback:hover,.mclose:hover{background:var(--panel-2);color:var(--txt)}
.mzone{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.16em;text-transform:uppercase;
  margin-bottom:6px;color:var(--gold)}
.modal.z-court .mzone{color:var(--court)} .modal.z-holy .mzone{color:var(--holy)} .modal.z-mhk .mzone{color:var(--mhk)}
.mname{font-family:'Gowun Batang',serif;font-weight:700;font-size:24px;margin:0;line-height:1.25;padding-right:100px}
.men{font-family:'Space Mono',monospace;font-size:11px;color:var(--txt-soft);margin:4px 0 0}
.crumbs{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:0 20px 10px;font-size:10.5px;
  color:var(--txt-dim);font-family:'Space Mono',monospace}
.crumbs i{font-style:normal;opacity:.5}
.crumbs .cb{cursor:pointer}
.crumbs .cb:hover{color:var(--txt-soft)}
.crumbs .cb.on{color:var(--gold)}

.interior{padding:0 14px 8px}
.ihead{font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--txt-dim);margin-bottom:6px;text-align:center}
svg.floor{width:100%;height:auto;display:block;border-radius:12px;border:1px solid var(--line)}
svg.floor .fitem{transition:filter .15s}
svg.floor .fitem:hover{filter:brightness(1.4)}
svg.floor text{font-family:'IBM Plex Sans KR',sans-serif}

/* 평면 정보 섹션 (트리 없음) */
.mbody{padding:4px 20px 20px}
.sec{padding:13px 0;border-top:1px solid var(--line)}
.sec:first-child{border-top:none;padding-top:4px}
.seclbl{font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--txt-dim);margin-bottom:7px}
.sec p{margin:0;font-size:14.5px}
.sec p.tp{color:var(--gold);background:rgba(217,164,65,.07);border-left:2px solid var(--gold);
  padding:10px 13px;border-radius:0 8px 8px 0;font-size:14px}
dl.kv{margin:0;display:grid;grid-template-columns:42px 1fr;gap:6px 10px}
dl.kv dt{font-family:'Space Mono',monospace;font-size:9.5px;color:var(--txt-dim);padding-top:4px;
  text-transform:uppercase}
dl.kv dd{margin:0;font-size:14px}

.reflist{display:flex;flex-wrap:wrap;gap:6px}
.refpill{font-family:'Space Mono',monospace;font-size:11.5px;border:1px solid var(--line);
  background:var(--bg2);color:var(--gold);border-radius:8px;padding:5px 10px;cursor:pointer;transition:.15s}
.refpill:hover{background:var(--panel-2);border-color:var(--gold)}
.refpill.on{background:var(--gold);color:#1a1712;border-color:var(--gold)}
.verses{margin-top:10px;display:flex;flex-direction:column;gap:9px}
.vblock{border-left:2px solid var(--line);padding:2px 0 2px 12px}
.vblock .vh{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--txt-dim);margin-bottom:3px}
.vblock p{margin:0 0 5px;font-size:14px;line-height:1.65}
.vblock p:last-child{margin:0}
.vblock .vn{color:var(--gold);font-family:'Space Mono',monospace;font-size:10.5px;margin-right:5px}

/* 제사장 */
.ptabs{display:flex;gap:6px;padding:0 20px 12px}
.ptab{flex:1;border:1px solid var(--line);background:var(--bg2);color:var(--txt-soft);border-radius:10px;
  padding:9px 0;font-size:13.5px;cursor:pointer;font-family:inherit;transition:.15s}
.ptab.on{background:var(--gold);color:#1a1712;border-color:var(--gold);font-weight:600}
.cards{display:flex;flex-direction:column;gap:8px}
.pcard{background:var(--bg2);border:1px solid var(--line);border-radius:13px;padding:12px 14px;
  cursor:pointer;color:var(--txt);font-family:inherit;text-align:left;transition:.15s}
.pcard:hover{background:var(--panel-2);border-color:var(--gold)}
.pc-h{display:flex;align-items:baseline;gap:8px;margin-bottom:3px}
.pc-h b{font-size:15px;font-weight:600}
.pc-h em{font-style:normal;font-family:'Space Mono',monospace;font-size:10px;color:var(--txt-dim);margin-left:auto}
.pcard p{margin:0;font-size:12.5px;color:var(--txt-soft);line-height:1.6}
.robewrap{text-align:center;margin-bottom:14px}
svg.robefig{width:158px;height:auto;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:6px}
svg.robefig .rpart{transition:filter .15s}
svg.robefig .rpart:hover{filter:brightness(1.5) drop-shadow(0 0 4px rgba(217,164,65,.7))}
.rhint{font-family:'Space Mono',monospace;font-size:10px;color:var(--txt-dim);margin-top:6px}
.dhead{padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:2px}
.dhead h4{font-family:'Gowun Batang',serif;font-size:20px;margin:0;font-weight:700}
.dhead span{font-family:'Space Mono',monospace;font-size:10.5px;color:var(--txt-dim)}

.timeline{position:relative;padding-left:18px}
.timeline:before{content:"";position:absolute;left:4px;top:12px;bottom:12px;width:2px;background:var(--line)}
.tnode{display:block;width:100%;background:none;border:none;padding:5px 0;cursor:pointer;
  color:var(--txt);font-family:inherit;text-align:left;position:relative}
.tdot{position:absolute;left:-18px;top:20px;width:10px;height:10px;border-radius:50%;
  background:var(--gold);border:2px solid var(--panel)}
.tnode.warn .tdot{background:var(--holy)}
.tnode.christ .tdot{background:#fff;box-shadow:0 0 8px rgba(255,255,255,.55)}
.tinfo{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 13px;transition:.15s}
.tnode:hover .tinfo{background:var(--panel-2);border-color:var(--gold)}
.tnode.christ .tinfo{border-color:var(--gold);background:linear-gradient(90deg,rgba(217,164,65,.12),var(--bg2))}
.tl-h{display:flex;align-items:baseline;gap:8px}
.tl-h b{font-size:15px;font-weight:600}
.tl-h em{font-style:normal;font-family:'Space Mono',monospace;font-size:10px;color:var(--txt-dim)}
.tinfo span{display:block;font-size:12.5px;color:var(--txt-soft);margin-top:2px}
.tinfo small{display:block;font-family:'Space Mono',monospace;font-size:9.5px;color:var(--txt-dim);margin-top:3px}

@media (max-width:560px){
  .mname{font-size:20px;padding-right:92px}
  svg#scene{height:min(70vh,560px)}
  .scenehint{font-size:9px;max-width:50%}
  .grid{grid-template-columns:repeat(auto-fill,minmax(84px,1fr))}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1 id="ttl">성 <span class="glow">막</span></h1>
  <p class="sub" id="tsub">The Tabernacle · 출애굽기 25–40</p>
</header>

<nav class="tabs" id="tabs">
  <button data-t="tab" class="on"><b>성막</b><em>출애굽기</em></button>
  <button data-t="solomon"><b>솔로몬 성전</b><em>열왕기 · 역대기</em></button>
  <button data-t="herod"><b>스룹바벨 성전</b><em>제2성전 · 예수님 당시</em></button>
  <button data-t="ezekiel"><b>에스겔 성전</b><em>천년왕국</em></button>
</nav>

<div class="search">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
  <input id="q" type="text" placeholder="검색 (번제단, 야긴, 미문, 닫힌 동문…)" autocomplete="off">
  <button class="clr" id="clr">✕</button>
  <div class="reslist" id="reslist"></div>
</div>

<div id="pane-temple" hidden>
  <div class="tmodes" id="tmodes">
    <button data-m="plan" class="on"><b>조감도</b><em>평면 · 기호</em></button>
    <button data-m="orbit"><b>3D 구조</b><em>돌려 보기</em></button>
    <button data-m="fp"><b>1인칭</b><em>안에 서 보기</em></button>
  </div>
  <div class="tstage" id="tstage" data-mode="plan">
    <div class="tview tplan" id="tplan">
      <div class="planwrap"></div>
      <div class="plancard" id="plancard" hidden></div>
      <p class="scenehint">뜰을 누르면 그 자리에 들어가 봅니다 · 두 손가락으로 확대</p>
      <div class="rotbar"><button id="pzout" title="축소">−</button><button id="pzreset" title="전체">⌂</button><button id="pzin" title="확대">+</button></div>
    </div>
    <div class="tview t3d" id="t3d" hidden>
      <div class="vpbar" id="vpbar"></div>
      <div class="t3load" id="t3load">3D 성전을 짓는 중…</div>
      <div class="fpcard" id="fpcard"></div>
      <p class="scenehint t3hint o">한 손가락: 돌리기 · 두 손가락: 확대·옮기기 · 뜰을 누르면 그 자리로</p>
      <p class="scenehint t3hint f">드래그로 둘러보기 · 두 손가락으로 넓게/좁게 · 바닥을 누르면 걸어갑니다</p>
      <div class="zoombar"><button id="t3zin" title="확대">+</button><button id="t3zout" title="축소">−</button></div>
      <div class="rotbar t3bar">
        <button id="t3left" title="왼쪽"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button id="t3home" title="처음 보기">⌂</button>
        <button id="t3right" title="오른쪽"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
        <button id="t3full" title="크게 보기">⛶</button>
      </div>
    </div>
  </div>
  <div class="tlegend" id="tlegend"></div>
  <div class="priestbar"><button class="pbtn" id="histBtn"></button></div>
  <div class="glist" id="tglist"></div>
</div>

<div id="pane-tab" hidden>
<div class="scenebox">
  <svg id="scene" viewBox="0 0 760 640" preserveAspectRatio="xMidYMid meet" aria-label="성막 조감도"></svg>
  <p class="scenehint">드래그로 회전 · 누르면 들어갑니다</p>
  <div class="rotbar">
    <button id="rleft" title="왼쪽"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="rreset" title="정면">⌂</button>
    <button id="rright" title="오른쪽"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
  </div>
</div>

<div class="priestbar">
  <button class="pbtn" id="priestBtn">
    <span class="ico">✛</span>
    <b>제사장</b>
    <em>직무 · 의복 · 계보</em>
  </button>
</div>

<div class="glist" id="glist"></div>
</div>

</div>

<div class="zoomfx" id="zoomfx"></div>
<div class="overlay" id="hoverlay"><div class="modal" id="hmodal" role="dialog" aria-modal="true"></div></div>
<div class="overlay" id="overlay"><div class="modal" id="modal" role="dialog" aria-modal="true"></div></div>
<div class="overlay" id="poverlay"><div class="modal" id="pmodal" role="dialog" aria-modal="true"></div></div>

<script>


const ITEMS = {
  // ═══ 뜰 (LEVEL 1) ═══
  court: {

  z=z||0;

  const rx=dx*Math.cos(r)-dy*Math.sin(r);
  const ry=dx*Math.sin(r)+dy*Math.cos(r);
  const sign=PITCH<0?-1:1, pp=Math.abs(PITCH)*Math.PI/180;
  return [_OX+rx*_S, _OY+sign*ry*_S*Math.sin(pp)-z*_S*Math.cos(pp)];
}
function depth(x,y){
  const dx=x-CX, dy=y-CY, r=YAW*Math.PI/180;
  const sign=PITCH<0?-1:1;
  return sign*(dx*Math.sin(r)+dy*Math.cos(r));
}
function pts(a){ return a.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' '); }
const NS="http://www.w3.org/2000/svg";
function el(t,a,p){ const e=document.createElementNS(NS,t); for(const k in a) e.setAttribute(k,a[k]); if(p) p.appendChild(e); return e; }
function box(g,x,y,w,d,h,cT,cL,cR,extra){
  const T=[P(x,y,h),P(x+w,y,h),P(x+w,y+d,h),P(x,y+d,h)];
  const B=[P(x,y,0),P(x+w,y,0),P(x+w,y+d,0),P(x,y+d,0)];
  [{p:[B[0],B[1],T[1],T[0]],d:depth(x+w/2,y),c:cL},
   {p:[B[1],B[2],T[2],T[1]],d:depth(x+w,y+d/2),c:cR},
   {p:[B[2],B[3],T[3],T[2]],d:depth(x+w/2,y+d),c:cL},
   {p:[B[3],B[0],T[0],T[3]],d:depth(x,y+d/2),c:cR}]
   .sort((a,b)=>b.d-a.d)
   .forEach(f=>el('polygon',Object.assign({points:pts(f.p),fill:f.c},extra||{}),g));
  el('polygon',Object.assign({points:pts(T),fill:cT},extra||{}),g);
}

function buildScene(){
  computeFit();
  const svg=document.getElementById('scene');
  const old=svg.querySelector('#stage'); if(old) old.remove();
  const stage=el('g',{id:'stage'},svg);
  const gG=el('g',{},stage), gI=el('g',{},stage), gL=el('g',{},stage);
  el('polygon',{points:pts([P(0,0),P(100,0),P(100,50),P(0,50)]),
    fill:'#241f19','fill-opacity':'1',stroke:'#3a332b','stroke-width':'1'},gG);

  const LOD = dragging ? 0.5 : 1;
  const N = (v)=>Math.max(2,Math.round(v*LOD));
  [{x0:0,y0:0,x1:100,y1:0,n:N(20),d:depth(50,0)},
   {x0:100,y0:0,x1:100,y1:50,n:N(10),d:depth(100,25)},
   {x0:100,y0:50,x1:0,y1:50,n:N(20),d:depth(50,50)},
   {x0:0,y0:50,x1:0,y1:35,n:N(3),d:depth(0,42)},
   {x0:0,y0:15,x1:0,y1:0,n:N(3),d:depth(0,7)}]
  .sort((a,b)=>b.d-a.d).forEach(w=>{
    for(let i=0;i<w.n;i++){
      const t0=i/w.n,t1=(i+1)/w.n;
      const ax=w.x0+(w.x1-w.x0)*t0, ay=w.y0+(w.y1-w.y0)*t0;
      const bx=w.x0+(w.x1-w.x0)*t1, by=w.y0+(w.y1-w.y0)*t1;
      const A=P(ax,ay,0),B=P(bx,by,0),At=P(ax,ay,5),Bt=P(bx,by,5);
      el('polygon',{points:pts([A,B,Bt,At]),fill:'#e8e2d4','fill-opacity':'.9',
        stroke:'#c9c0ac','stroke-width':'.55'},gG);
      el('line',{x1:A[0],y1:A[1],x2:At[0],y2:At[1],stroke:'#8a7f6a','stroke-width':'1.3'},gG);
    }
  });
  (function(){
    const cols=['#3f6fa8','#7a4f96','#b23a3a','#e8e2d4'];
    for(let i=0;i<8;i++){
      const a=15+20*i/8, b=15+20*(i+1)/8;
      el('polygon',{points:pts([P(0,a,0),P(0,b,0),P(0,b,5),P(0,a,5)]),fill:cols[i%4],
        'fill-opacity':'.94',stroke:'#2a2520','stroke-width':'.4',class:'hot','data-k':'gate'},gG);
    }
  })();

  [{d:depth(22.5,25),draw:drawAltar},{d:depth(36,25),draw:drawLaver},{d:depth(65,25),draw:drawTent}]
    .sort((a,b)=>b.d-a.d).forEach(o=>o.draw(gI));

  if(!dragging) buildLabels(gL);
  bindHits(svg);
}

function bindHits(scope){
  scope.querySelectorAll('.hot,.lbl').forEach(n=>{

    n.style.cursor='pointer';

    n.addEventListener('click',fire);

}

function buildLabels(gL){
  const anchors=[
    {k:'gate',a:P(0,25,5.6)},{k:'altar',a:P(22.5,25,4.4)},{k:'laver',a:P(36,25,3.6)},
    {k:'holy',a:P(60,25,11.8)},{k:'mhk',a:P(75,25,11.8)},{k:'veil',a:P(70,20,6)},
    {k:'court',a:P(100,25,5.6)}
  ];
  const left=[],right=[];
  anchors.forEach(o=>{ (o.a[0]<OX?left:right).push(o); });
  const place=(arr,side)=>{
    arr.sort((p,q)=>p.a[1]-q.a[1]);
    const n=arr.length;
    // 앵커의 세로 위치를 최대한 따르되, 서로 겹치지 않게 최소 간격만 확보
    const MIN=42, top=30, bot=612;
    let ys=arr.map(o=>Math.max(top,Math.min(bot,o.a[1])));
    for(let i=1;i<n;i++) if(ys[i]-ys[i-1]<MIN) ys[i]=ys[i-1]+MIN;
    const over=ys[n-1]-bot;
    if(over>0) for(let i=n-1;i>=0;i--) ys[i]=Math.max(top,ys[i]-over);
    for(let i=1;i<n;i++) if(ys[i]-ys[i-1]<MIN) ys[i]=ys[i-1]+MIN;
    arr.forEach((o,i)=>{
      const ty=ys[i];
      // 앵커에서 살짝만 벗어난 위치에 배치 (그림을 밀어내지 않도록)
      const tx = side==='L' ? Math.max(56, o.a[0]-52) : Math.min(704, o.a[0]+52);
      const it=ITEMS[o.k];
      el('line',{x1:o.a[0],y1:o.a[1],x2:tx,y2:ty,stroke:'#D9A441','stroke-width':'1.1','stroke-opacity':'.65'},gL);
      el('circle',{cx:o.a[0],cy:o.a[1],r:3.8,fill:'#D9A441',stroke:'#141210','stroke-width':'1.3'},gL);
      const g=el('g',{class:'lbl','data-k':o.k},gL);
      el('circle',{cx:tx,cy:ty,r:3,fill:'#D9A441'},g);
      const t=el('text',{x:tx+(side==='L'?-10:10),y:ty+6.5,'text-anchor':side==='L'?'end':'start',
        'font-size':'21','font-weight':'700',fill:'#EFE9DD',
        stroke:'#141210','stroke-width':'4','paint-order':'stroke'},g);
      t.textContent=it.name;
    });
  };
  place(left,'L'); place(right,'R');
  [{t:'동',p:P(-9,25)},{t:'서',p:P(109,25)},{t:'남',p:P(50,-9)},{t:'북',p:P(50,59)}].forEach(d=>{
    const t=el('text',{x:d.p[0],y:d.p[1],'text-anchor':'middle','font-size':'17',fill:'#a89c85',
      'font-family':"'Space Mono',monospace",'font-weight':'700',
      stroke:'#141210','stroke-width':'3.4','paint-order':'stroke'},gL);
    t.textContent=d.t;
  });
  bindHits(gL);
}

// ══════════ 드래그 회전 (턴테이블 감각) ══════════
let dragging=false, dragged=false, lastX=0, lastY=0, raf=null;
let vYaw=0, vPitch=0, lastT=0, inertia=null, capId=null;
function renderLoop(){
  if(raf) return;
  raf=requestAnimationFrame(()=>{ raf=null; buildScene(); });
}
function initDrag(){
  const svg=document.getElementById('scene');
  const pt=e=>(e.touches&&e.touches[0])?e.touches[0]:e;
  const down=e=>{
    if(inertia){ cancelAnimationFrame(inertia); inertia=null; }
    dragging=true; dragged=false;
    const p=pt(e); lastX=p.clientX; lastY=p.clientY; lastT=performance.now();
    vYaw=0; vPitch=0; capId=null;
    if(e.type==='touchstart' && e.cancelable) e.preventDefault();
  };
  const move=e=>{
    if(!dragging) return;
    const p=pt(e), now=performance.now();
    const dx=p.clientX-lastX, dy=p.clientY-lastY;
    const dt=Math.max(8, now-lastT);
    // 첫 움직임부터 기본 스크롤 차단 (세로 드래그가 모달로 새는 것 방지)
    if(e.cancelable) e.preventDefault();
    if(Math.abs(dx)+Math.abs(dy)>3){
      dragged=true;
      if(capId===null && e.pointerId!==undefined && svg.setPointerCapture){
        try{ svg.setPointerCapture(e.pointerId); capId=e.pointerId; }catch(_){}
      }
    }
    if(!dragged){ lastX=p.clientX; lastY=p.clientY; return; }
    const dYaw=-dx*0.5;
    const dPitch=dy*0.26;
    YAW += dYaw;
    PITCH = Math.max(0, Math.min(58, PITCH + dPitch));
    // 속도 (지수 평활 — 튀는 값 억제)
    vYaw   = vYaw*0.72   + (dYaw/dt*16)*0.28;
    vPitch = vPitch*0.72 + (dPitch/dt*16)*0.28;
    lastX=p.clientX; lastY=p.clientY; lastT=now;
    renderLoop();
    if(e.cancelable) e.preventDefault();
  };
  const up=e=>{
    if(!dragging) return;
    dragging=false;
    if(capId!==null && svg.releasePointerCapture){ try{svg.releasePointerCapture(capId);}catch(_){} capId=null; }
    // 관성 감속
    if(Math.abs(vYaw)>0.12 || Math.abs(vPitch)>0.12){
      const glide=()=>{
        vYaw*=0.93; vPitch*=0.93;
        YAW += vYaw;
        PITCH = Math.max(0, Math.min(58, PITCH + vPitch));
        buildScene();
        if(Math.abs(vYaw)>0.05 || Math.abs(vPitch)>0.05) inertia=requestAnimationFrame(glide);
        else { inertia=null; buildScene(); }
      };
      inertia=requestAnimationFrame(glide);
    } else if(dragged) buildScene();
    setTimeout(()=>{dragged=false;},60);
  };
  if(window.PointerEvent){
    svg.addEventListener('pointerdown',down);
    svg.addEventListener('pointermove',move,{passive:false});
    svg.addEventListener('pointerup',up);
    svg.addEventListener('pointercancel',up);
    svg.addEventListener('pointerleave',e=>{ if(dragging) up(e); });
  } else {
    svg.addEventListener('mousedown',down);
    svg.addEventListener('touchstart',down,{passive:false});
    window.addEventListener('mousemove',move);
    svg.addEventListener('touchmove',move,{passive:false});
    window.addEventListener('mouseup',up);
    window.addEventListener('touchend',up);
    window.addEventListener('touchcancel',up);
  }
  const spin=d=>{
    if(inertia){ cancelAnimationFrame(inertia); inertia=null; }
    const from=YAW, to=YAW+d, t0=performance.now();
    (function step(t){
      const k=Math.min(1,(t-t0)/320);
      YAW=from+(to-from)*(1-Math.pow(1-k,3));
      buildScene();
      if(k<1) requestAnimationFrame(step);
    })(t0);
  };
  // 그림 위에서 시작한 터치는 문서 밖(아티팩트 뷰어)으로 새지 않게 소비
  document.addEventListener('touchmove',function(e){
    if(dragging && e.cancelable) e.preventDefault();
  },{passive:false});
  // iOS 제스처(핀치/스와이프) 차단
  svg.addEventListener('gesturestart',e=>e.preventDefault());
  svg.addEventListener('gesturechange',e=>e.preventDefault());
    document.getElementById('rleft').addEventListener('click',()=>spin(-45));
  document.getElementById('rright').addEventListener('click',()=>spin(45));
  document.getElementById('rreset').addEventListener('click',()=>{
    if(inertia){ cancelAnimationFrame(inertia); inertia=null; }
    YAW=0;PITCH=36;buildScene();
  });
}

function scriptureBlock(k,src){
  const bank = src==='P'?PSCRIPT:SCRIPTURE;
  const cites=bank[k]||[];
  if(!cites.length) return '';
  return `<div class="sec">
    <div class="seclbl">말씀 구절</div>
    <div class="reflist" data-k="${k}" data-src="${src}">
      ${cites.map((c,i)=>`<button class="refpill" data-i="${i}">${c.ref}</button>`).join('')}
    </div>
    <div class="verses"></div>
  </div>`;
}
function bindScripture(scope){
  scope.querySelectorAll('.reflist').forEach(rl=>{
    const k=rl.dataset.k, src=rl.dataset.src;
    const bank = src==='P'?PSCRIPT:SCRIPTURE;
    const vw=rl.parentElement.querySelector('.verses');
    rl.querySelectorAll('.refpill').forEach(b=>{
      b.addEventListener('click',()=>{
        const i=+b.dataset.i, c=bank[k][i], id='v-'+src+'-'+k+'-'+i;
        const ex=vw.querySelector('#'+CSS.escape(id));
        if(ex){ ex.remove(); b.classList.remove('on'); return; }
        const dv=document.createElement('div'); dv.className='vblock'; dv.id=id;
        let s=`<div class="vh">${c.book} ${c.ref.replace(/^[가-힣]+/,'')}</div>`;
        c.verses.forEach(v=>{ s+=`<p><span class="vn">${v.v}</span>${v.t}</p>`; });
        dv.innerHTML=s; vw.appendChild(dv); b.classList.add('on');
      });
    });
  });
}
// 평면 정보 섹션 (트리 없음)
function sec(lbl,html){ return `<div class="sec"><div class="seclbl">${lbl}</div>${html}</div>`; }
function kv(rows){ return `<dl class="kv">`+rows.map(r=>`<dt>${r[0]}</dt><dd>${r[1]}</dd>`).join('')+`</dl>`; }

// ══════════ 성막 모달 ══════════
const overlay=document.getElementById('overlay'), modal=document.getElementById('modal');
const zoomfx=document.getElementById('zoomfx');
let stack=[];
const ZC={'뜰':'z-court','성소':'z-holy','지성소':'z-mhk'};
function zoomTo(k){ zoomfx.className='zoomfx on'; setTimeout(()=>{ openItem(k); zoomfx.className='zoomfx'; },230); }
function openItem(k){ stack.push(k); renderItem(); overlay.classList.add('on'); document.body.style.overflow='hidden'; }
function backItem(){ stack.pop(); stack.length?renderItem():closeModal(); }
function closeModal(){ stack=[]; overlay.classList.remove('on'); document.body.style.overflow=''; }
function renderItem(){
  const k=stack[stack.length-1], it=ITEMS[k];
  modal.className='modal '+(it.cls||ZC[it.zone]||'');
  let inner='';
  if(k==='holy') inner=`<div class="interior"><div class="ihead">성소 안 — 기구를 누르세요</div>${interiorSVG('holy')}</div>`;
  if(k==='mhk')  inner=`<div class="interior"><div class="ihead">지성소 안 — 기구를 누르세요</div>${interiorSVG('mhk')}</div>`;
  if(it.t && window.TempleUI){ const d=TempleUI.innerFor(k); if(d) inner=d; }
  const crumb=stack.map((s,i)=>`<span class="cb${i===stack.length-1?' on':''}" data-i="${i}">${ITEMS[s].name}</span>`).join('<i>›</i>');
  const rows=[]; if(it.size) rows.push(['규격',it.size]); if(it.material) rows.push(['재료',it.material]);
  const story=it.zone==='역사'||it.zone==='해석';
  modal.innerHTML=`
    <div class="mtop">
      <button class="mclose" id="mclose">✕</button>
      ${stack.length>1?'<button class="mback" id="mback">‹ 뒤로</button>':''}
      <div class="mzone">${it.t?TempleUI.templeName(it.t)+' · ':''}${it.era||it.zone}</div>
      <h3 class="mname">${it.name}</h3>
      <div class="men">${it.en||''}</div>
    </div>
    <div class="crumbs">${crumb}</div>
    ${inner}
    ${it.fp?`<div class="fpwrap"><button class="fpbtn" id="mfp"><b>1인칭 시점으로 보기</b></button></div>`:''}
    <div class="mbody">
      ${rows.length?sec('규격 · 재료',kv(rows)):''}
      ${it.use?sec(story?'내용':'쓰임',`<p>${it.use}</p>`):''}
      ${it.meaning?sec(story?'의미':'신앙적 의미',`<p>${it.meaning}</p>`):''}
      ${(it.more||[]).map(([l,t])=>sec(l,`<p>${t}</p>`)).join('')}
      ${it.type&&(!it.t||it.t==='tab')?sec('그리스도의 예표',`<p class="tp">${it.type}</p>`):''}
      ${it.note?sec('참고',`<p class="note">${it.note}</p>`):''}
      ${scriptureBlock(k,'T')}
    </div>`;
  modal.querySelector('#mclose').addEventListener('click',closeModal);
  const bk=modal.querySelector('#mback'); if(bk) bk.addEventListener('click',backItem);
  const fb=modal.querySelector('#mfp'); if(fb) fb.addEventListener('click',()=>TempleUI.enterFP(it.t,it.fp));
  if(it.t && window.TempleUI) TempleUI.bindInner(modal);
  bindScripture(modal);
  modal.querySelectorAll('.fitem').forEach(n=>n.addEventListener('click',()=>{
    zoomfx.className='zoomfx on'; setTimeout(()=>{ openItem(n.dataset.k); zoomfx.className='zoomfx'; },200);
  }));
  modal.querySelectorAll('.cb').forEach(n=>n.addEventListener('click',()=>{ stack=stack.slice(0,+n.dataset.i+1); renderItem(); }));
  modal.scrollTop=0;
}
overlay.addEventListener('click',e=>{ if(e.target===overlay) closeModal(); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if(pOverlay.classList.contains('on')) closePriest(); else closeModal(); } });

// ══════════ 제사장 (탭 상태 유지 + 평면 구조) ══════════
const pOverlay=document.getElementById('poverlay'), pModal=document.getElementById('pmodal');
let pTab='duty', pDetail=null;
const ROBEFIG=`<svg viewBox="0 0 200 262" class="robefig">
  <g class="rpart" data-k="rb_plate"><ellipse cx="100" cy="30" rx="26" ry="16" fill="#e8e2d4"/>
    <rect x="80" y="30" width="40" height="8" rx="3" fill="#d9b23a"/></g>
  <circle cx="100" cy="52" r="16" fill="#c9a882"/>
  <g class="rpart" data-k="rb_robe"><path d="M70 74 q30 -12 60 0 l10 118 q-40 10 -80 0 z" fill="#3f6fa8"/>
    ${[76,90,104,118,132].map(x=>`<circle cx="${x}" cy="194" r="4" fill="#d9b23a"/>`).join('')}
    ${[83,97,111,125].map(x=>`<circle cx="${x}" cy="196" r="3.4" fill="#b23a3a"/>`).join('')}</g>
  <g class="rpart" data-k="rb_ephod"><path d="M74 78 q26 -10 52 0 l6 74 q-32 8 -64 0 z" fill="#7a4f96"/>
    <rect x="72" y="150" width="56" height="9" rx="3" fill="#d9b23a"/>
    <circle cx="80" cy="84" r="6" fill="#e8e2d4"/><circle cx="120" cy="84" r="6" fill="#e8e2d4"/></g>
  <g class="rpart" data-k="rb_breast"><rect x="85" y="96" width="30" height="30" rx="2" fill="#c9a227" stroke="#8a6a1e"/>
    ${[0,1,2,3].map(r=>[0,1,2].map(c=>`<rect x="${88+c*8}" y="${99+r*7}" width="6" height="5" rx="1" fill="${['#b23a3a','#3f6fa8','#7C9070','#e8e2d4','#7a4f96','#d9b23a'][(r*3+c)%6]}"/>`).join('')).join('')}</g>
  <g class="rpart" data-k="rb_urim"><circle cx="100" cy="111" r="5" fill="none" stroke="#fff" stroke-width="1.3" opacity=".85" stroke-dasharray="2 2"/></g>
  <g class="rpart" data-k="rb_tunic"><path d="M78 196 q22 8 44 0 l4 40 q-26 6 -52 0 z" fill="#e8e2d4"/></g>
  <g class="rpart" data-k="rb_linen"><rect x="84" y="236" width="32" height="16" rx="3" fill="#cfc7b4"/></g>
</svg>`;
function openPriestModal(){ pDetail=null; renderPriest(); pOverlay.classList.add('on'); document.body.style.overflow='hidden'; }
function closePriest(){ pOverlay.classList.remove('on'); document.body.style.overflow=''; }
function renderPriest(){
  // 상세가 있으면 상세, 없으면 목록 — 탭(pTab)은 항상 유지
  let head=`<div class="mtop">
      <button class="mclose" id="pclose">✕</button>
      ${pDetail?'<button class="mback" id="pback">‹ 목록</button>':''}
      <div class="mzone">The Priesthood</div>
      <h3 class="mname">제사장</h3>
      <div class="men">직무 · 의복 · 계보</div>
    </div>
    <div class="ptabs">
      ${[['duty','직무'],['robe','의복'],['line','계보']].map(([t,n])=>
        `<button class="ptab${pTab===t?' on':''}" data-t="${t}">${n}</button>`).join('')}
    </div>`;
  let body='';
  if(pDetail){
    body=`<div class="mbody">${detailHTML(pTab,pDetail)}</div>`;
  } else if(pTab==='duty'){
    body=`<div class="mbody"><div class="cards">`+DUTIES.map(d=>`
      <button class="pcard" data-k="${d.k}">
        <div class="pc-h"><b>${d.name}</b><em>${d.where}</em></div>
        <p>${d.desc.split('.')[0]}.</p>
      </button>`).join('')+`</div></div>`;
  } else if(pTab==='robe'){
    body=`<div class="mbody">
      <div class="robewrap">${ROBEFIG}<div class="rhint">그림의 각 부분을 눌러도 열립니다</div></div>
      <div class="cards">`+ROBES.map(r=>`
      <button class="pcard" data-k="${r.k}">
        <div class="pc-h"><b>${r.name}</b><em>${r.pos}</em></div>
        <p>${r.desc.split('.')[0]}.</p>
      </button>`).join('')+`</div></div>`;
  } else {
    body=`<div class="mbody"><div class="timeline">`+LINE.map(p=>`
      <button class="tnode${p.warn?' warn':''}${p.christ?' christ':''}" data-k="${p.k}">
        <i class="tdot"></i>
        <div class="tinfo"><div class="tl-h"><b>${p.name}</b><em>${p.gen}</em></div>
        <span>${p.tag}</span><small>${p.era}</small></div>
      </button>`).join('')+`</div></div>`;
  }
  pModal.className='modal p-modal';
  pModal.innerHTML=head+body;
  pModal.querySelector('#pclose').addEventListener('click',closePriest);
  const pb=pModal.querySelector('#pback');
  if(pb) pb.addEventListener('click',()=>{ pDetail=null; renderPriest(); });
  pModal.querySelectorAll('.ptab').forEach(t=>t.addEventListener('click',()=>{
    pTab=t.dataset.t; pDetail=null; renderPriest();
  }));
  pModal.querySelectorAll('.pcard,.tnode').forEach(n=>n.addEventListener('click',()=>{
    pDetail=n.dataset.k; renderPriest();
  }));
  pModal.querySelectorAll('.rpart').forEach(n=>{
    n.style.cursor='pointer';
    n.addEventListener('click',()=>{ pDetail=n.dataset.k; renderPriest(); });
  });
  bindScripture(pModal);
  pModal.scrollTop=0;
}
function detailHTML(tab,key){
  if(tab==='duty'){
    const d=DUTIES.find(x=>x.k===key);
    return `<div class="dhead"><h4>${d.name}</h4><span>${d.where}</span></div>
      ${sec('무슨 일인가',`<p>${d.desc}</p>`)}
      ${sec('그리스도의 예표',`<p class="tp">${d.type}</p>`)}
      ${scriptureBlock(d.k,'P')}`;
  }
  if(tab==='robe'){
    const r=ROBES.find(x=>x.k===key);
    return `<div class="dhead"><h4>${r.name}</h4><span>${r.en} · ${r.pos}</span></div>
      ${sec('재료 · 모양',kv([['재료',r.material],['모양',r.desc]]))}
      ${sec('신앙적 의미',`<p>${r.meaning}</p>`)}
      ${sec('그리스도의 예표',`<p class="tp">${r.type}</p>`)}
      ${scriptureBlock(r.k,'P')}`;
  }
  const p=LINE.find(x=>x.k===key);
  return `<div class="dhead"><h4>${p.name}</h4><span>${p.gen} · ${p.era}</span></div>
    ${sec('기록',`<p>${p.note}</p>`)}
    ${scriptureBlock(p.k,'P')}`;
}
pOverlay.addEventListener('click',e=>{ if(e.target===pOverlay) closePriest(); });
document.getElementById('priestBtn').addEventListener('click',openPriestModal);

// ══════════ 검색 ══════════
const q=document.getElementById('q'), clr=document.getElementById('clr'), reslist=document.getElementById('reslist');
function norm(s){ return s.toLowerCase().replace(/\s+/g,''); }
function doSearch(){
  const v=norm(q.value);
  clr.classList.toggle('on', q.value.length>0);
  reslist.innerHTML='';
  if(!v){ reslist.classList.remove('on'); return; }
  reslist.classList.add('on');
  const rows=[];
  Object.keys(ITEMS).forEach(k=>{ const it=ITEMS[k];
    if(norm(it.name+(it.en||'')+(it.kw||'')+it.zone+(it.code||'')).includes(v)) rows.push({n:it.name,z:(it.t?TempleUI.templeName(it.t):'성막')+' · '+it.zone,go:()=>openItem(k)}); });
  DUTIES.forEach(d=>{ if(norm(d.name+d.where).includes(v)) rows.push({n:d.name,z:'제사장 · 직무',go:()=>{pTab='duty';pDetail=d.k;openPriestModal2();}}); });
  ROBES.forEach(r=>{ if(norm(r.name+r.en).includes(v)) rows.push({n:r.name,z:'제사장 · 의복',go:()=>{pTab='robe';pDetail=r.k;openPriestModal2();}}); });
  LINE.forEach(p=>{ if(norm(p.name+p.gen+p.tag).includes(v)) rows.push({n:p.name,z:'제사장 · 계보',go:()=>{pTab='line';pDetail=p.k;openPriestModal2();}}); });
  if(!rows.length){ reslist.innerHTML='<div class="nores">결과가 없어요</div>'; return; }
  rows.forEach(r=>{
    const b=document.createElement('button'); b.className='res';
    b.innerHTML=`<b>${r.n}</b><span>${r.z}</span>`;
    b.addEventListener('click',r.go); reslist.appendChild(b);
  });
}
function openPriestModal2(){ renderPriest(); pOverlay.classList.add('on'); document.body.style.overflow='hidden'; }
q.addEventListener('input',doSearch);
clr.addEventListener('click',()=>{ q.value=''; doSearch(); q.focus(); });

// ══════════ 기구 목록 (구역별 그룹) ══════════
const groups=[
  {z:'뜰', cls:'z-court', keys:['court','gate','altar','laver']},
  {z:'성소', cls:'z-holy', keys:['tent','holy','lamp','table','incense','veil']},
  {z:'지성소', cls:'z-mhk', keys:['mhk','ark','mercy']}
];
const glist=document.getElementById('glist');
groups.forEach(g=>{
  const sec=document.createElement('div'); sec.className='gsec '+g.cls;
  sec.innerHTML=`<div class="ghead"><i></i>${g.z}<em>${g.keys.length}</em></div>
    <div class="grid">`+g.keys.map(k=>`<button class="gitem" data-k="${k}">${ITEMS[k].name.split(' (')[0]}</button>`).join('')+`</div>`;
  glist.appendChild(sec);
});
glist.querySelectorAll('.gitem').forEach(n=>n.addEventListener('click',()=>openItem(n.dataset.k)));

buildScene();
initDrag();

</script>
<script src="temples-data.js"></script>
<script src="temples-scripture.js"></script>
<script src="temples-ui.js"></script>
</body>
